<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071c17">
<title>Al-Quran | القرآن الكريم</title>
<style>
:root {
  --bg:#071c17;
  --panel:#102820;
  --panel2:#18372c;
  --gold:#d5b878;
  --text:#f5f0df;
  --muted:#a8b7aa;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 6%;
  border-bottom:1px solid #ffffff18;
}
.logo {font-size:22px;font-weight:bold;color:var(--gold)}
button,input {
  font:inherit;
}
button {
  cursor:pointer;
  border:1px solid #ffffff25;
  border-radius:10px;
  padding:11px 16px;
  background:var(--panel2);
  color:var(--text);
}
button:hover {border-color:var(--gold)}
main {max-width:1150px;margin:auto;padding:35px 20px}
.hero {text-align:center;padding:45px 10px}
.hero h1 {
  font-size:clamp(34px,7vw,58px);
  color:var(--gold);
  margin:0 0 12px;
}
.hero p {color:var(--muted)}
.search {
  width:min(600px,100%);
  padding:16px;
  border:1px solid #ffffff25;
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
  margin-top:20px;
}
.section-title {
  color:var(--gold);
  margin:35px 0 18px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
}
.card {
  background:var(--panel);
  padding:20px;
  border:1px solid #ffffff15;
  border-radius:15px;
  text-align:left;
  transition:.2s;
}
.card:hover {transform:translateY(-3px);border-color:var(--gold)}
.card strong {display:block;font-size:19px;margin-bottom:8px}
.card span {color:var(--muted);font-size:13px}
.reader {
  display:none;
  background:var(--panel);
  padding:28px;
  margin-top:30px;
  border-radius:18px;
  text-align:center;
}
.arabic {
  font-family:"Traditional Arabic","Noto Naskh Arabic",serif;
  font-size:clamp(30px,5vw,46px);
  line-height:2.1;
  direction:rtl;
  color:var(--gold);
}
footer {
  text-align:center;
  color:var(--muted);
  padding:35px;
}
[dir="rtl"] .card {text-align:right}
@media(max-width:600px) {
  header {padding:16px}
  main {padding:20px 14px}
  .hero {padding:35px 5px}
  .reader {padding:18px}
}
</style>
</head>
<body>
<header>
  <div class="logo">☾ AL-QURAN</div>
  <button id="language">العربية</button>
</header>

<main>
  <section class="hero">
    <h1 id="heading">The Holy Quran</h1>
    <p id="subtitle">A peaceful place to read, explore and reflect.</p>
    <input class="search" id="search"
      placeholder="Search Surahs..."
      aria-label="Search Surahs">
  </section>

  <h2 class="section-title" id="surahTitle">Surahs</h2>
  <div class="grid" id="surahs"></div>

  <section class="reader" id="reader">
    <h2 id="readerTitle"></h2>
    <p id="readerInfo"></p>
    <p class="arabic" id="verse"></p>
    <p id="translation"></p>
    <p id="page"></p>
    <button onclick="closeReader()" id="back">Back to Surahs</button>
  </section>
</main>

<footer>
  AL-QURAN · القرآن الكريم
</footer>

let arabicMode=false;

function render(list=names) {
 const container=document.getElementById("surahs");
 container.innerHTML="";
 list.forEach((s)=>{
   const index=names.indexOf(s);
   const card=document.createElement("button");
   card.className="card";
   card.innerHTML=<strong>${index+1}. ${arabicMode?s[1]:s[0]}</strong><span>${s[2]} verses · ${arabicMode?"سورة":"Surah"}</span>;
   card.onclick=()=>openSurah(index);
   container.appendChild(card);
 });
}
function openSurah(index) {
 const s=names[index];
 document.getElementById("reader").style.display="block";
 document.getElementById("readerTitle").textContent=
   (index+1)+". "+s[1]+" · "+s[0];
 document.getElementById("readerInfo").textContent=
   s[2]+" verses";
 document.getElementById("verse").textContent=
   "Verified Quran text will be connected in the next development stage.";
 document.getElementById("translation").textContent=
   "Translation and tafsir sources will be added after verification.";
 document.getElementById("page").textContent=
   "Mushaf page information will be connected to the verified Quran dataset.";
 document.getElementById("reader").scrollIntoView({behavior:"smooth"});
}
function closeReader() {
 document.getElementById("reader").style.display="none";
}
document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase();
 render(names.filter(s=>s[0].toLowerCase().includes(q)||s[1].includes(q)));
});
document.getElementById("language").onclick=()=>{
 arabicMode=!arabicMode;document.documentElement.lang=arabicMode?"ar":"en";
 document.documentElement.dir=arabicMode?"rtl":"ltr";
 document.getElementById("language").textContent=arabicMode?"English":"العربية";
 document.getElementById("heading").textContent=arabicMode?"القرآن الكريم":"The Holy Quran";
 document.getElementById("subtitle").textContent=arabicMode?"مكان هادئ للقراءة والتدبر":"A peaceful place to read, explore and reflect.";
 document.getElementById("surahTitle").textContent=arabicMode?"السور":"Surahs";
 document.getElementById("search").placeholder=arabicMode?"ابحث عن سورة...":"Search Surahs...";
 document.getElementById("back").textContent=arabicMode?"العودة إلى السور":"Back to Surahs";
 render();
};

</html>
